[project]
name = "atcoder-programming"
version = "0.1.0"
description = "AtcoderのABC問題ディレクトリ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "online-judge-tools>=11.5.1",
    "setuptools>=83.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# テンプレート・コンテスト解答は先出しimportを許容する
"template.py" = ["F401"]
"contests/**/*.py" = ["F401"]
